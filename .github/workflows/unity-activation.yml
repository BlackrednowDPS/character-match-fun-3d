name: Request Unity Activation File

# One-time helper. Unity 6 stores licenses as UnityEntitlementLicense.xml rather
# than the classic .ulf that GameCI requires, so a .ulf must be generated via
# Unity's manual activation flow:
#
#   1. Run this workflow (Actions tab -> Request Unity Activation File -> Run workflow)
#   2. Download the "Unity_v6000.5.6f1.alf" artifact it produces and unzip it
#   3. Go to https://license.unity3d.com/manual and upload the .alf
#      - License type: Unity Personal
#      - "Which best describes you": whichever applies (hobbyist etc.)
#   4. Unity returns a Unity_v6000.x.ulf file — open it in a text editor
#   5. Copy its ENTIRE contents into a new repo secret named UNITY_LICENSE
#   6. Re-run the "Build WebGL and Deploy to Pages" workflow
#
# After UNITY_LICENSE is set, this workflow is no longer needed.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.5.6f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
